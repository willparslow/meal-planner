<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Planner</title>
<meta name="theme-color" content="#2f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meals">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="splash"><div class="spinner"></div><p>Loading your meals…</p></div>
</div>
<nav class="tabbar" id="tabbar" hidden>
  <button data-action="tab" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Plan</span></button>
  <button data-action="tab" data-tab="meals"><svg viewBox="0 0 24 24"><path d="M4 11h16v2a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7z"/><path d="M2.5 11h19M9 7c0-1.5 1-1.5 1-3M14 7c0-1.5 1-1.5 1-3"/></svg><span>Meals</span></button>
  <button data-action="tab" data-tab="stock"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5V3h6v1.5M8.5 12l2.2 2.2L15.5 9.5"/></svg><span>Stock</span></button>
  <button data-action="tab" data-tab="shop"><svg viewBox="0 0 24 24"><path d="M3 9h18l-2 10.5a2 2 0 0 1-2 1.5H7a2 2 0 0 1-2-1.5z"/><path d="M8 9l3-5M16 9l-3-5M9 13v4M15 13v4M12 13v4"/></svg><span>Shop</span><b class="badge" id="shop-badge" hidden></b></button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
